cvs.addEventListener('contextmenu',e=>e.preventDefault());
let camMode=false,lx=0,ly=0;cvs.addEventListener('pointerdown',e=>{if(mode!='garage')return;lx=e.clientX;ly=e.clientY;if(e.button==2||camMode){drag=true;return}const c=cell(e);if(!c)return;const k=c[0]+','+c[1],old=layout[k];
if(tool=='del'||e.shiftKey){if(old){inv[old]++;delete layout[k]}}else{if(old==tool||inv[tool]<=0)return;if(old)inv[old]++;layout[k]=tool;inv[tool]--}rebuild()});
addEventListener('pointerup',()=>drag=false);addEventListener('pointercancel',()=>drag=false);
addEventListener('pointermove',e=>{if(mode!='garage')return;if(drag){az-=(e.clientX-lx)*.008;el=clamp(el+(e.clientY-ly)*.006,.3,1.4);lx=e.clientX;ly=e.clientY;return}const c=cell(e);hl.visible=!!c;if(c){hl.position.set(c[0]-3,.03,c[1]-3);const k=c[0]+','+c[1];hl.material.color.set(tool=='del'?(layout[k]?0xff4d4d:0x555555):(inv[tool]>0?0x4cd964:0xff4d4d))}});
addEventListener('wheel',e=>{dist=clamp(dist+e.deltaY*.01,6,18)});
$('#tb').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id=='cam'){camMode=!camMode;b.classList.toggle('sel',camMode)}else dist=clamp(dist+(b.id=='zo'?2:-2),6,18)};
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k,s=v=>e=>{e.preventDefault();K[k]=v;b.classList.toggle('on',!!v)};b.onpointerdown=s(1);b.onpointerup=b.onpointercancel=b.onpointerleave=s(0);b.oncontextmenu=e=>e.preventDefault()});
// ---------- БОЙ ----------
const K={};addEventListener('keydown',e=>K[e.code]=1);addEventListener('keyup',e=>K[e.code]=0);
let mode='garage',F=null,E=null,cd=0,last=performance.now();
function spawn(lay,col,x,z,yaw){const r=buildRobot(lay,col),f=Object.assign(r,{x,z,yaw,vx:0,vz:0});f.max=stats(f.parts).hp;arena.add(f.g);return f}
function startFight(){mode='fight';garage.visible=false;arena.visible=true;$('#ui').hidden=true;$('#hud').hidden=false;$('#pad').hidden=false;$('#ov').hidden=true;
F=spawn(layout,0x3da5ff,0,6,0);E=spawn(preset(),0xff4d4d,0,-6,Math.PI);cd=3.2;cam.position.set(0,6.5,15)}
$('#fight').onclick=startFight;
function leave(){mode='garage';[F,E].forEach(f=>f&&arena.remove(f.g));debris.forEach(d=>arena.remove(d.m));debris=[];F=E=null;garage.visible=true;arena.visible=false;$('#ui').hidden=false;$('#hud').hidden=true;$('#pad').hidden=true;$('#ov').hidden=true;$('#cd').hidden=true}
function drive(f,thr,trn,dt){const s=stats(f.parts),tr=s.P?clamp(1+14*s.P/s.m,.8,3.2):0;f.yaw+=trn*tr*dt;
const fx=-Math.sin(f.yaw),fz=-Math.cos(f.yaw),sx=Math.cos(f.yaw),sz=-Math.sin(f.yaw);let vf=f.vx*fx+f.vz*fz,vs=f.vx*sx+f.vz*sz;
vf=clamp(vf+(thr*(thr<0?.7:1)*s.acc-1.6*vf)*dt,-7,9);vs*=Math.exp(-8*dt);f.vx=fx*vf+sx*vs;f.vz=fz*vf+sz*vs;f.vf=vf;
f.x+=f.vx*dt;f.z+=f.vz*dt;const L=10-2.4;if(Math.abs(f.x)>L){f.x=Math.sign(f.x)*L;f.vx*=-.4}if(Math.abs(f.z)>L){f.z=Math.sign(f.z)*L;f.vz*=-.4}
f.g.position.set(f.x,0,f.z);f.g.rotation.y=f.yaw;
f.parts.forEach(p=>{if(!p.spin)return;if(p.t=='saw')p.spin.rotation.x+=45*dt;else p.spin.rotation.x-=vf*dt/.42})}
function wpos(f){const c=Math.cos(f.yaw),s=Math.sin(f.yaw);f.parts.forEach(p=>{p.wx=f.x+p.x*c+p.z*s;p.wz=f.z-p.x*s+p.z*c;if(p.reach){p.tx=p.wx+(p.ox*c+p.oz*s)*p.reach;p.tz=p.wz+(-p.ox*s+p.oz*c)*p.reach}})}
function hurt(f,p,a,x,z){p.hp-=a;if(p.hp>0)return;f.parts.splice(f.parts.indexOf(p),1);arena.attach(p.mesh);spark(p.wx,.6,p.wz,25);
debris.push({m:p.mesh,vx:(Math.random()-.5)*8+f.vx,vy:Math.random()*6+2,vz:(Math.random()-.5)*8+f.vz,rx:Math.random()*8,rz:Math.random()*8,t:0})}
function hits(a,b,dt){a.parts.slice().forEach(p=>{if(!p.reach)return;let best=null,bd=.8;b.parts.forEach(q=>{const d=Math.hypot(q.wx-p.tx,q.wz-p.tz);if(d<bd){bd=d;best=q}});if(best){hurt(b,best,T[p.t].dmg*dt,p.tx,p.tz);spark(p.tx,.6,p.tz,2)}})}
function collide(a,b){let bd=.95,pa,pb;a.parts.forEach(p=>b.parts.forEach(q=>{const d=Math.hypot(q.wx-p.wx,q.wz-p.wz);if(d<bd){bd=d;pa=p;pb=q}}));if(!pa)return;
const ma=stats(a.parts).m,mb=stats(b.parts).m,nx=(pb.wx-pa.wx)/(bd||1),nz=(pb.wz-pa.wz)/(bd||1),ov=.95-bd,ra=mb/(ma+mb),rb=ma/(ma+mb);
a.x-=nx*ov*ra;a.z-=nz*ov*ra;b.x+=nx*ov*rb;b.z+=nz*ov*rb;const vr=(b.vx-a.vx)*nx+(b.vz-a.vz)*nz;
if(vr<0){const j=-1.4*vr/(1/ma+1/mb);a.vx-=nx*j/ma;a.vz-=nz*j/ma;b.vx+=nx*j/mb;b.vz+=nz*j/mb;if(-vr>2.5){const d=-vr*6;hurt(a,pa,d);hurt(b,pb,d);spark((pa.wx+pb.wx)/2,.6,(pa.wz+pb.wz)/2,12)}}}
function ai(e,p,dt){const dx=p.x-e.x,dz=p.z-e.z;let df=Math.atan2(-dx,-dz)-e.yaw;df=Math.atan2(Math.sin(df),Math.cos(df));drive(e,Math.abs(df)<1.3?1:.15,clamp(df*2.5,-1,1),dt)}
function fightTick(dt){
const g=(a,b)=>(K[a]||K[b]?1:0);
if(cd>0){cd-=dt;$('#cd').hidden=false;$('#cd').textContent=cd>.2?Math.ceil(cd-.2):'БОЙ!';if(cd<=0)$('#cd').hidden=true}
if(cd<=0&&mode=='fight'){drive(F,g('KeyW','ArrowUp')-g('KeyS','ArrowDown'),g('KeyA','ArrowLeft')-g('KeyD','ArrowRight'),dt);ai(E,F,dt);wpos(F);wpos(E);collide(F,E);wpos(F);wpos(E);hits(F,E,dt);hits(E,F,dt);F.g.position.set(F.x,0,F.z);E.g.position.set(E.x,0,E.z);
const a=stats(F.parts).hp/F.max,b=stats(E.parts).hp/E.max;$('#h1').style.width=Math.max(0,a*100)+'%';$('#h2').style.width=Math.max(0,b*100)+'%';
if(a<.25||b<.25||!F.parts.length||!E.parts.length){mode='over';const w=a>=.25&&b<.25||!E.parts.length&&F.parts.length;
$('#ov').hidden=false;$('#ov').innerHTML=`<h2 style="color:${w?'#4cd964':'#ff4d4d'}">${w?'ПОБЕДА!':'ПОРАЖЕНИЕ'}</h2><p style="color:var(--mu)">${w?'Вражеский робот разобран на запчасти.':'Ваш робот разбит. Соберите лучше!'}</p><button class="big" id="back">В мастерскую</button>`;$('#back').onclick=leave}}
else if(mode=='over'){drive(E,0,0,dt);drive(F,0,0,dt)}
const P=F;cam.position.lerp(new THREE.Vector3(P.x+Math.sin(P.yaw)*9,6.8,P.z+Math.cos(P.yaw)*9),.06);cam.lookAt(P.x-Math.sin(P.yaw)*2,.4,P.z-Math.cos(P.yaw)*2);
debris=debris.filter(d=>{d.t+=dt;d.vy-=18*dt;d.m.position.x+=d.vx*dt;d.m.position.z+=d.vz*dt;d.m.position.y+=d.vy*dt;d.m.rotation.x+=d.rx*dt;d.m.rotation.z+=d.rz*dt;
if(d.m.position.y<0){d.m.position.y=0;d.vy*=-.35;d.vx*=.7;d.vz*=.7;d.rx*=.6;d.rz*=.6}if(d.t>12){arena.remove(d.m);return false}return true});sparkTick(dt)}
function garageTick(dt){const D=dist*(innerWidth<innerHeight?1.25:1);cam.position.set(Math.sin(az)*Math.cos(el)*D,Math.sin(el)*D+.4,Math.cos(az)*Math.cos(el)*D);cam.lookAt(0,.4,0);cur.parts.forEach(p=>{if(p.t=='saw')p.spin.rotation.x+=dt*8})}
rebuild();
(function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;mode=='garage'?garageTick(dt):fightTick(dt);R.render(S,cam);requestAnimationFrame(loop)})(performance.now());
</script></body></html>
